# 非敏感配置(敏感的见 secret.example.yaml,真实值只在集群里创建)
apiVersion: v1
kind: ConfigMap
metadata:
  name: tutor-config
  namespace: tutor
data:
  # 允许登录的 GitHub 用户名(逗号分隔)。空 = 拒绝所有登录
  GITHUB_ALLOWLIST: "maxhello"
  # 允许跨域的来源:Pages 线上地址 + 本地 dev
  CORS_ORIGINS: "https://maxhello.github.io,http://localhost:5173"
