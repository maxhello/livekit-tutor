# PostgreSQL 16:单副本 StatefulSet,数据落在 k3s 自带 local-path 存储
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: tutor
  labels: &labels
    app: postgres
    part-of: livekit-tutor
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: tutor
            - name: POSTGRES_DB
              value: tutor
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tutor-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata # local-path 需要,避免 lost+found 冲突
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "tutor", "-d", "tutor"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path # k3s 自带
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tutor
  labels: *labels
spec:
  clusterIP: None
  selector: *labels
  ports:
    - port: 5432
