# 入口:用 k3s 自带的 Traefik,cert-manager 自动签发/续期 Let's Encrypt 证书。
#
# 前置(cert-manager 只需装一次,见 README.md):
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.17.2/cert-manager.yaml
#
# 域名规则:公网 IP 1.2.3.4 → 1-2-3-4.sslip.io。把下面两处域名换成你的。
# 以后买了真域名:也只改这两处。
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # LE 要求填邮箱(到期通知),换成你的
    email: you@example.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tutor-api
  namespace: tutor
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik # k3s 自带
  tls:
    - hosts: ["203-0-113-10.sslip.io"] # ← 改成你的 <IP横杠>.sslip.io
      secretName: tutor-api-tls
  rules:
    - host: 203-0-113-10.sslip.io # ← 同上
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
