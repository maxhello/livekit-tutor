# 入口:用 k3s 自带的 Traefik,cert-manager 自动签发/续期 Let's Encrypt 证书。
#
# 前置(cert-manager 只需装一次,见 README.md):
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.17.2/cert-manager.yaml
#
# 域名规则:sslip.io 把「任意前缀 + IP 横杠」都解析到该 IP,所以每个服务
# 分一个子域名(tutor / blog / xxx.161-118-222-205.sslip.io),各自独立 Ingress
# + 各自证书,加新服务互不干扰。以后买了真域名:改下面两处 host 即可。
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # LE 要求填邮箱(到期通知),换成你的
    email: hz_testing@163.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tutor-api
  namespace: max
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik # k3s 自带
  tls:
    - hosts: ["tutor.161-118-222-205.sslip.io"] # 每个服务一个子域名(sslip.io 任意前缀都解析到 161.118.222.205)
      secretName: tutor-api-tls
  rules:
    - host: tutor.161-118-222-205.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tutor-api
                port:
                  number: 8000
