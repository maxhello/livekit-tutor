# 后端镜像:push 触碰 server/** 时构建并推 GHCR,服务器上 rollout restart 即更新
name: server-image

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3 # 交叉构建 arm64(服务器是 Oracle ARM)

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tutor-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
